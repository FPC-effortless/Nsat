[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngsatml"
version = "0.4.0"
description = "Reproducible Nigeria satellite and food-price ML dataset builder"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6",
  "requests>=2.31",
  "pystac-client>=0.8",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.14",
  "planetary-computer>=1.0",
]
dev = ["pytest>=8"]

[project.scripts]
ngsatml = "ngsatml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
