name: Build nationwide NBS targets

on:
  push:
    branches:
      - main
      - data/nbs-national-upgrade-v2
    paths:
      - 'src/ngsatml/cpi.py'
      - 'src/ngsatml/cohd.py'
      - 'src/ngsatml/nbs.py'
      - 'src/ngsatml/nbs_mirror.py'
      - 'src/ngsatml/nbs_targets.py'
      - 'src/ngsatml/cli.py'
      - 'tests/test_nbs_targets.py'
      - 'pyproject.toml'
      - '.github/workflows/build-nbs-targets.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ngsatml/cpi.py'
      - 'src/ngsatml/cohd.py'
      - 'src/ngsatml/nbs.py'
      - 'src/ngsatml/nbs_mirror.py'
      - 'src/ngsatml/nbs_targets.py'
      - 'src/ngsatml/cli.py'
      - 'tests/test_nbs_targets.py'
      - 'pyproject.toml'
      - '.github/workflows/build-nbs-targets.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 20 * *'

permissions:
  contents: read

concurrency:
  group: nbs-targets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit regression tests
        run: pytest -q tests/test_nbs_targets.py tests/test_state_context.py
      - name: Build nationwide state targets
        run: |
          rm -rf data/nbs-targets
          python -m ngsatml.cli nbs-targets \
            --output data/nbs-targets \
            --start-date 2024-10-01 \
            --strict
      - name: Verify artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/nbs-targets')
          required = [
              'nbs_food_cpi.parquet',
              'nbs_food_cpi.csv',
              'nbs_cohd.parquet',
              'nbs_cohd.csv',
              'nbs_state_month_targets.parquet',
              'nbs_source_index.csv',
              'nbs_quality.json',
              'nbs_summary.json',
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit(f'Missing required NBS artifacts: {missing}')
          q = json.loads((root / 'nbs_quality.json').read_text())
          if not q['cpi']['ok'] or not q['cohd']['ok']:
              raise SystemExit(f'Quality gate failed: {json.dumps(q, indent=2)}')
          s = json.loads((root / 'nbs_summary.json').read_text())
          if s['cpi_rows'] < 37 or s['cohd_rows'] < 37:
              raise SystemExit(f'Insufficient all-state coverage: {s}')
          print(json.dumps(s, indent=2))
          PY
      - name: Checksums
        run: |
          cd data/nbs-targets
          sha256sum *.parquet *.csv *.json > SHA256SUMS.txt
      - name: Publish build summary
        if: always()
        run: |
          if [ -f data/nbs-targets/nbs_summary.json ]; then
            echo '## Nsat NBS nationwide target build' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/nbs-targets/nbs_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload validated target layer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nsat-nbs-state-targets
          path: |
            data/nbs-targets/*.parquet
            data/nbs-targets/*.csv
            data/nbs-targets/*.json
            data/nbs-targets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
