name: Inspect NBS food-price tables

on:
  push:
    branches:
      - data/nbs-national-upgrade-v2
    paths:
      - 'scripts/inspect_nbs.py'
      - 'pyproject.toml'
      - '.github/workflows/inspect-nbs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Inspect live NBS workbooks
        run: python scripts/inspect_nbs.py data/nbs/schema_report.json
      - name: Upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: nbs-schema-report
          path: data/nbs/schema_report.json
          if-no-files-found: error
          retention-days: 7
